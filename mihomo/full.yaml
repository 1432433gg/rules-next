# Mihomo 完整配置：带分流，需要 mihomo v1.19.31 以上
# 用法：把内容复制到 /etc/mihomo/config.yaml，把节点前的 #~ 全部删掉（查找替换为空），带「填」的换成自己的

proxies:
  ## VLESS + Reality + Vision
  #~- name: JP
  #~  type: vless
  #~  server: example.com # 填：服务器（或中转机）域名或 IP
  #~  port: 443 # 填：端口
  #~  uuid: # 填：UUID
  #~  network: tcp
  #~  tls: true
  #~  udp: false
  #~  flow: xtls-rprx-vision
  #~  servername: example.com # 填：Reality 用的域名
  #~  reality-opts:
  #~    public-key: # 填：Reality 公钥
  #~    short-id: # 填：short-id
  #~  client-fingerprint: chrome

  ## Shadowsocks 2022
  #~- name: SG
  #~  type: ss
  #~  server: # 填：服务器域名或 IP
  #~  port: 8388 # 填：端口
  #~  cipher: 2022-blake3-aes-128-gcm
  #~  password: # 填：密码
  #~  udp: false

mixed-port: 7893
tcp-concurrent: true
allow-lan: true
ipv6: false
log-level: info
unified-delay: true
external-controller: 0.0.0.0:9090
secret: "" # 面板密码，可以留空
external-ui: /etc/mihomo/ui

geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb"

profile: { store-selected: true, store-fake-ip: false }
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff: { HTTP: { ports: [80], override-destination: true }, TLS: { ports: [443, 8443] }, QUIC: { ports: [443, 8443] } }

tun:
  enable: true
  stack: mips
  dns-hijack: [any:53]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['+.lan', '*', '+.local', '+.cmpassport.com', 'id6.me', 'open.e.189.cn', 'mdn.open.wo.cn', 'opencloud.wostore.cn', 'auth.wosms.cn', '+.10099.com.cn', '+.msftconnecttest.com', '+.msftncsi.com', 'lancache.steamcontent.com']
  cache-algorithm: arc
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

hosts:
  dns.alidns.com: [223.5.5.5,223.6.6.6]
  doh.pub: [1.12.12.21,120.53.53.53]

pg: &pg {type: select, proxies: [手动切换, DIRECT]}
c: &c {type: http, behavior: classical, format: text, interval: 86400}

proxy-groups:

  - {name: 手动切换, type: select, include-all: true, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Proxy.png}
  - {name: 国外网站, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Global.png}
  - {name: 国际媒体, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/ForeignMedia.png}
  - {name: YouTube, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/YouTube.png}
  - {name: Netflix, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Netflix.png}
  - {name: NFblock, type: select, proxies: [Netflix, REJECT], icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Netflix_Letter.png}
  - {name: Telegram, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Telegram.png}
  - {name: AI, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/AI.png}
  - {name: Broker, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Cryptocurrency.png}
  - {name: 苹果服务, type: select, proxies: [DIRECT, 手动切换], icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Apple.png}
  - {name: 兜底分流, <<: *pg, icon: https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Final.png}

rule-providers:

  Direct: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Direct.list}
  Lan: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Lan.list}
  Reject: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Reject.list}
  AppleProxy: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/AppleServers.list}
  Microsoft: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Microsoft.list}
  Github: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Github.list}
  YouTube: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/YouTube.list}
  Google: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Google.list}
  Telegram: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Telegram.list}
  Twitter: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Twitter.list}
  Facebook: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Facebook.list}
  Steam: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Steam.list}
  Epic: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Epic.list}
  AI: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/AI.list}
  Broker: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Broker.list}
  NetflixBlock: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/NetflixBlock.list}
  Emby: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Emby.list}
  Spotify: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Spotify.list}
  Bahamut: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Bahamut.list}
  Netflix: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Netflix.list}
  Disney: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/Disney.list}
  PrimeVideo: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/PrimeVideo.list}
  HBO: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/HBO.list}
  TikTok: {<<: *c, url: https://github.com/1432433gg/rules-next/raw/main/rules/TikTok.list}
