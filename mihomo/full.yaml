rules:
  - RULE-SET,NetflixBlock,NFblock
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Reject,REJECT
  - RULE-SET,AI,AI
  - RULE-SET,Broker,Broker
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Twitter,国外网站
  - RULE-SET,Facebook,国外网站
  - RULE-SET,TikTok,国外网站
  - RULE-SET,Steam,国外网站
  - RULE-SET,Epic,国外网站
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Google,国外网站
  - RULE-SET,Github,国外网站
  - RULE-SET,Microsoft,国外网站
  - RULE-SET,Emby,国际媒体
  - RULE-SET,Spotify,国外网站
  - RULE-SET,Bahamut,国际媒体
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Disney,国际媒体
  - RULE-SET,PrimeVideo,国际媒体
  - RULE-SET,HBO,国际媒体
  - RULE-SET,Proxy,国外网站
  - RULE-SET,AppleProxy,苹果服务
  - GEOIP,CN,DIRECT
  - MATCH,兜底分流
  - NETWORK,UDP,REJECT # 节点没开 UDP 时，UDP 不漏到直连
