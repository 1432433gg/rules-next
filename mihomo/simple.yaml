# mihomo-gateway 默认配置：没有节点、没有分流，所有流量直连
# 换成自己的配置：直接改这个文件，改完运行 /usr/local/bin/mihomo/mihomo -t -d /etc/mihomo 检查，再 systemctl restart mihomo

mixed-port: 7893
allow-lan: true
ipv6: false
log-level: info
external-controller: 0.0.0.0:9090
external-ui: /etc/mihomo/ui
secret: "" # 面板密码，可以留空

tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  listen: :1053
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.21, 120.53.53.53]

rules:
  - MATCH,DIRECT
