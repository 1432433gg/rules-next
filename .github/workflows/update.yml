name: 更新规则

on:
  schedule:
    - cron: "0 22 * * *" # 每天北京时间 06:00
  push: # 改了自己的规则或同步列表，马上重新生成
    branches: [main]
    paths: [custom/**, sources.txt, quantumultx/sources.txt, scripts/update.sh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载最新规则
        run: bash scripts/update.sh

      - name: 下载 Quantumult X 规则
        run: bash scripts/update.sh qx

      - name: 有变化就提交
        run: |
          git add -A rules quantumultx/rules
          if git diff --cached --quiet; then
            echo "规则没有变化"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "更新规则 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          # 运行期间有人推了别的提交：先接上再推
          git pull -q --rebase origin main
          git push
