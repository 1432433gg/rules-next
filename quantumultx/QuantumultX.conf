# Quantumult X 配置：分组和 Mihomo 完整配置（mihomo/full.yaml）一样
# 节点在 App 里添加，或把 [server_local] 里的 #~ 删掉再填；去广告要在 App 里生成并信任 MITM 证书

[general]
server_check_url = http://cp.cloudflare.com/generate_204
network_check_url = http://wifi.vivo.com.cn/generate_204
server_check_timeout = 5000
geo_location_checker = http://ip-api.com/json/?lang=zh-CN,https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
excluded_routes = 239.255.255.250/32
udp_drop_list = QUIC
dns_exclusion_list = *.lan, *.direct, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, opencloud.wostore.cn, auth.wosms.cn, *.10099.com.cn, *.msftconnecttest.com, *.msftncsi.com, lancache.steamcontent.com
fallback_udp_policy = reject

[dns]
no-ipv6
no-system
server = 223.5.5.5
server = 119.29.29.29
# App Store 下载走金山 CDN
alias = /iosapps.itunes.apple.com/iosapps.itunes.apple.com.download.ks-cdn.com

[policy]
static=手动切换, server-tag-regex=., img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Proxy.png
static=国外网站, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Global.png
static=国际媒体, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/ForeignMedia.png
static=YouTube, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/YouTube.png
static=Netflix, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Netflix.png
static=NFblock, Netflix, reject, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Netflix_Letter.png
static=Telegram, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Telegram.png
static=AI, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/AI.png
static=Broker, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Cryptocurrency.png
static=苹果服务, direct, 手动切换, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Apple.png
static=兜底分流, 手动切换, direct, img-url=https://raw.githubusercontent.com/1432433gg/rules-next/main/color/Final.png

[server_local]
## VLESS + Reality + Vision
#~vless=example.com:443, method=none, password=填UUID, obfs=over-tls, obfs-host=example.com, reality-base64-pubkey=填公钥, reality-hex-shortid=填short-id, vless-flow=xtls-rprx-vision, udp-relay=false, tag=JP
## Shadowsocks 2022
#~shadowsocks=example.com:8388, method=2022-blake3-aes-128-gcm, password=填密码, udp-relay=false, tag=SG

